<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>MultiTrack</title>

<style>
body {
    font-family: Arial;
    background: #111;
    color: #fff;
    padding: 40px;
}

.container {
    max-width: 700px;
    margin: auto;
}

.card {
    background: #1c1c1c;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 15px;
}

button {
    padding: 10px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.btn {
    background: #00ff88;
    font-weight: bold;
}

.btn-danger {
    background: #ff4d4d;
    margin-top: 5px;
}

input, select {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    margin-bottom: 10px;
    border-radius: 6px;
    border: none;
}

/* MODAL */
.modal {
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.8);
}

.modal-box {
    background:#1c1c1c;
    padding:20px;
    max-width:500px;
    margin:80px auto;
    border-radius:10px;
}
</style>

</head>
<body>

<div class="container">

<h2>🔥 MultiTrack - Produtos</h2>

<button class="btn" onclick="abrirModal()">➕ Criar Pixel</button>

<br><br>

<div id="lista">Carregando...</div>

</div>

<!-- MODAL -->
<div id="modal" class="modal">
    <div class="modal-box">

        <h3>Criar Pixel</h3>

        <input id="m_name" placeholder="Nome do Pixel">
        <input id="m_pixel_id" placeholder="Pixel ID">
        <input id="m_token" placeholder="Token">

        <button class="btn" onclick="salvarPixel()">Salvar</button>
        <button class="btn-danger" onclick="fecharModal()">Cancelar</button>

    </div>
</div>

<script>

async function carregar() {

    const products = await (await fetch("/products")).json();
    const pixels = await (await fetch("/products/pixels")).json();

    const lista = document.getElementById("lista");
    lista.innerHTML = "";

    if (!products.length) {
        lista.innerHTML = `
            <p style="text-align:center;opacity:0.7">
                Nenhum produto ainda.<br>
                Faça uma venda ou teste webhook 🚀
            </p>
        `;
        return;
    }

    products.forEach(p => {

        const status = p.pixel_ref
            ? "🟢 Ativo"
            : "🔴 Sem Pixel";

        lista.innerHTML += `
            <div class="card">
                <b>${p.name || "Sem nome"}</b><br>
                Plataforma: ${p.platform}<br>
                Product ID: ${p.product_id}<br>
                Status: ${status}<br><br>

                <label>Purchase:</label>
                <select onchange="vincular(${p.id}, this.value)">
                    <option value="">Selecionar Pixel</option>
                    ${pixels.map(px => `
                        <option value="${px.id}" ${p.pixel_ref == px.id ? "selected" : ""}>
                            ${px.name}
                        </option>
                    `).join("")}
                </select>

                <button class="btn-danger" onclick="excluir(${p.id})">Excluir</button>
            </div>
        `;
    });

}

// =============================
// MODAL
// =============================

function abrirModal() {
    document.getElementById("modal").style.display = "block";
}

function fecharModal() {
    document.getElementById("modal").style.display = "none";
}

// =============================
// CRIAR PIXEL (CORRETO)
// =============================

async function salvarPixel() {

    const name = document.getElementById("m_name").value;
    const pixel_id = document.getElementById("m_pixel_id").value;
    const token = document.getElementById("m_token").value;

    if (!name || !pixel_id || !token) {
        alert("Preencha tudo");
        return;
    }

    const res = await fetch("/products/create-pixel", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ name, pixel_id, token })
    });

    const json = await res.json();

    alert(json.message);

    fecharModal();
    carregar();
}

// =============================
// VINCULAR PIXEL (Purchase)
// =============================

async function vincular(product_id, pixel_id) {

    await fetch("/products/link-pixel", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ product_id, pixel_id })
    });

}

// =============================
// EXCLUIR
// =============================

async function excluir(id) {

    const confirmar = confirm("Tem certeza?");

    if (!confirmar) return;

    const res = await fetch(`/products/${id}`, {
        method: "DELETE"
    });

    const json = await res.json();

    alert(json.message);

    carregar();
}

carregar();

</script>

</body>
</html>
