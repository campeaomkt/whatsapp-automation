<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>MultiTrack - Pixels</title>

<style>
body {
    font-family: Arial;
    background: #111;
    color: #fff;
    padding: 40px;
}

.container {
    max-width: 700px;
    margin: auto;
}

.card {
    background: #1c1c1c;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 15px;
}

.btn {
    background: #00ff88;
    padding: 10px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
}

.btn-danger {
    background: #ff4d4d;
    padding: 10px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
}

input, select {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
    border-radius: 6px;
    border: none;
}

/* MODAL */
.modal {
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.8);
}

.modal-box {
    background:#1c1c1c;
    padding:20px;
    max-width:400px;
    margin:100px auto;
    border-radius:10px;
}
</style>

</head>
<body>

<div class="container">

<h2>🔥 MultiTrack - Pixels</h2>

<button class="btn" onclick="abrirModal()">➕ Criar Pixel</button>

<br><br>

<div id="lista">Carregando...</div>

</div>

<!-- MODAL -->
<div id="modal" class="modal">
    <div class="modal-box">

        <h3>Criar Pixel</h3>

        <input id="m_name" placeholder="Nome do Pixel">
        <input id="m_pixel_id" placeholder="Pixel ID">
        <input id="m_token" placeholder="Token">

        <button class="btn" onclick="salvarPixel()">Salvar</button>
        <button class="btn-danger" onclick="fecharModal()">Cancelar</button>

    </div>
</div>

<script>

async function carregar() {

    const pixels = await (await fetch("/products/pixels")).json();
    const products = await (await fetch("/products")).json();

    const lista = document.getElementById("lista");
    lista.innerHTML = "";

    if (!pixels.length) {
        lista.innerHTML = "<p>Nenhum pixel ainda</p>";
        return;
    }

    pixels.forEach(px => {

        lista.innerHTML += `
            <div class="card">

                <b>${px.name}</b><br>
                Pixel ID: ${px.pixel_id}<br><br>

                <b>Purchase:</b>

                <select onchange="vincular(${px.id}, this.value)">
                    <option value="">Selecionar produto</option>
                    ${products.map(p => `
                        <option value="${p.id}">
                            ${p.name || "Sem nome"}
                        </option>
                    `).join("")}
                </select>

                <br>

                <button class="btn-danger" onclick="excluirPixel(${px.id})">
                    🗑️ Excluir Pixel
                </button>

            </div>
        `;
    });

}

// =============================
// CRIAR PIXEL
// =============================

async function salvarPixel() {

    const name = document.getElementById("m_name").value;
    const pixel_id = document.getElementById("m_pixel_id").value;
    const token = document.getElementById("m_token").value;

    const res = await fetch("/products/create-pixel", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ name, pixel_id, token })
    });

    const json = await res.json();

    alert(json.message);

    fecharModal();
    carregar();
}

// =============================
// VINCULAR PRODUCT → PIXEL
// =============================

async function vincular(pixel_id, product_id) {

    await fetch("/products/link-pixel", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
            product_id,
            pixel_id
        })
    });

    alert("Produto vinculado ao Purchase!");
}

// =============================
// EXCLUIR PIXEL
// =============================

async function excluirPixel(id) {

    const confirmar = confirm("Tem certeza que deseja excluir esse pixel?");

    if (!confirmar) return;

    const res = await fetch(`/products/pixel/${id}`, {
        method: "DELETE"
    });

    const json = await res.json();

    alert(json.message);

    carregar();
}

// =============================

function abrirModal() {
    document.getElementById("modal").style.display = "block";
}

function fecharModal() {
    document.getElementById("modal").style.display = "none";
}

carregar();

</script>

</body>
</html>
